name: 💡 Feature Request
description: Propose a new feature, enhancement, or tool integration for Personal Agentic Fleet.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new features! Please describe your idea and how it aligns with the zero-token microkernel architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe the solution you'd like to see implemented.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative approaches or workarounds you have considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request implementing this feature.


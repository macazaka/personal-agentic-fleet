name: Automated Security, Runtime & Privacy Audit

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-runtime-audit:
    name: 12-Layer Security & Python ${{ matrix.python-version }} Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Minimum Python >= 3.10 & Fleet Doctor
        run: |
          python -m fleet.tools.fleet_doctor --strict

      - name: Run Deterministic 12-Layer Security & Privacy Scanner
        run: |
          python -m fleet.tools.security_scanner --strict

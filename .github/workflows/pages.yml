name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Pages Enablement
        id: check_pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo "404")
          if [ "$STATUS_CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        id: setup_pages
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build Documentation Site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp -r docs/* _site/
          # Create a lightweight fallback index.html if markdown renderer is not used
          python -c "
          import os
          docs = sorted([f for f in os.listdir('_site') if f.endswith('.md')])
          links = '\n'.join([f'<li><a href=\"{f}\">{f}</a></li>' for f in docs])
          html = f'''<!DOCTYPE html>
          <html>
          <head>
            <meta charset=\"utf-8\">
            <title>Personal Agentic Fleet Documentation</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1e293b; }}
              h1 {{ color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }}
              ul {{ list-style-type: none; padding: 0; }}
              li {{ margin: 10px 0; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; }}
              a {{ text-decoration: none; color: #0369a1; font-weight: 600; }}
              a:hover {{ text-decoration: underline; }}
            </style>
          </head>
          <body>
            <h1>Personal Agentic Fleet — Documentation Portal</h1>
            <p>Welcome to the official technical documentation for Personal Agentic Fleet.</p>
            <ul>{links}</ul>
          </body>
          </html>'''
          with open('_site/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          "

      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages Setup Notice
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages Setup::To publish documentation to Pages, navigate to GitHub Repository Settings -> Pages -> Build and deployment -> Source: select 'GitHub Actions'."


name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'fleet/__init__.py'
      - 'pyproject.toml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag & Extract Changelog Notes
        id: release_meta
        shell: bash
        run: |
          python3 - << 'EOF'
          import os, re, pathlib
          init_txt = pathlib.Path("fleet/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_txt)
          ver = m.group(1).strip() if m else "2.6.0"
          tag = f"v{ver}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={ver}\n")
              fh.write(f"tag={tag}\n")

          cl_path = pathlib.Path("CHANGELOG.md")
          notes = f"Personal Agentic Fleet {tag}"
          if cl_path.is_file():
              cl_txt = cl_path.read_text(encoding="utf-8")
              sec_m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^---\n\n## \[|^## \[|\Z)", cl_txt, re.M | re.S)
              if sec_m and sec_m.group(1).strip():
                  notes = sec_m.group(1).strip()
          pathlib.Path("release_body.md").write_text(notes + "\n", encoding="utf-8")
          EOF

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Generate CycloneDX SBOM
        run: |
          python -m fleet.tools.sbom_generator

      - name: Build Python Distribution (Wheel & Sdist)
        run: |
          python -m build

      - name: Generate Cryptographic SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > ../checksums.sha256
          cd ..
          sha256sum fleet/data/sbom.cdx.json >> checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Personal Agentic Fleet ${{ steps.release_meta.outputs.tag }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            dist/*
            fleet/data/sbom.cdx.json
            checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


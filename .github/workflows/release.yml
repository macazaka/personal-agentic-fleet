name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'fleet/__init__.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (Native Git)
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "${GITHUB_TOKEN}" | base64 -w 0)" fetch --tags --force --depth=50 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Python 3.12 Runtime
        shell: bash
        run: |
          python3 --version

      - name: Determine Release Tag & Extract Changelog Notes
        id: release_meta
        shell: bash
        run: |
          python3 - << 'EOF'
          import os, re, pathlib
          init_txt = pathlib.Path("fleet/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_txt)
          ver = m.group(1).strip() if m else "2.8.3"
          tag = f"v{ver}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={ver}\n")
              fh.write(f"tag={tag}\n")

          cl_path = pathlib.Path("CHANGELOG.md")
          notes = f"Personal Agentic Fleet {tag}"
          if cl_path.is_file():
              cl_txt = cl_path.read_text(encoding="utf-8")
              sec_m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^---\n\n## \[|^## \[|\Z)", cl_txt, re.M | re.S)
              if sec_m and sec_m.group(1).strip():
                  notes = sec_m.group(1).strip()
          pathlib.Path("release_body.md").write_text(notes + "\n", encoding="utf-8")
          EOF

      - name: Install packaging dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade --break-system-packages pip build || python3 -m pip install --upgrade pip build

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          python3 -m fleet.tools.sbom_generator

      - name: Build Python Distribution (Wheel & Sdist)
        shell: bash
        run: |
          python3 -m build

      - name: Generate Cryptographic SHA-256 Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > ../checksums.sha256
          cd ..
          sha256sum fleet/data/sbom.cdx.json >> checksums.sha256

      - name: Publish GitHub Release (Immutable-Release Safe)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "[IMMUTABLE RELEASE GUARD] Release ${RELEASE_TAG} already exists on GitHub. Skipping asset overwrite to respect immutable release protection."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            dist/* \
            fleet/data/sbom.cdx.json \
            checksums.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Personal Agentic Fleet ${RELEASE_TAG}" \
            --notes-file release_body.md \
            --generate-notes

name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze Python Codebase
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:python"
        output: sarif-results

    - name: Verify Zero CodeQL Alerts in SARIF Output
      shell: bash
      run: |
        python3 - << 'EOF'
        import glob, json, sys
        sarif_files = glob.glob("sarif-results/*.sarif")
        alerts = []
        for sf in sarif_files:
            data = json.load(open(sf, encoding="utf-8"))
            for run in data.get("runs", []):
                for res in run.get("results", []):
                    rule_id = res.get("ruleId", "unknown")
                    msg = res.get("message", {}).get("text", "").replace("\n", " ")[:120]
                    locs = res.get("locations", [])
                    loc_str = "unknown"
                    if locs:
                        ploc = locs[0].get("physicalLocation", {})
                        uri = ploc.get("artifactLocation", {}).get("uri", "")
                        line = ploc.get("region", {}).get("startLine", 0)
                        loc_str = f"{uri}:{line}"
                    alerts.append(f"[{rule_id}] {loc_str} ({msg})")
        print(f"Total CodeQL SARIF alerts found: {len(alerts)}")
        for i in range(0, len(alerts), 5):
            chunk = " | ".join(alerts[i:i+5])
            print(f"::error title=CodeQL Alerts ({i+1}-{min(i+5, len(alerts))} of {len(alerts)})::{chunk}")
        if alerts:
            sys.exit(1)
        EOF

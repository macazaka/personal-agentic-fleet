name: Fleet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  type-check:
    name: Pyright Type Analysis (Zero VSCode Diagnostics)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Pyright Type Checking
      run: |
        npx --yes pyright fleet

  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package & Test Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest anyio coverage pygame-ce requests starlette pydantic uvicorn

    - name: Run Test Suite
      timeout-minutes: 8
      env:
        PYTHONPATH: .
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        FLEET_TEST_MODE: "1"
      run: |
        python -m pytest tests/ -v --tb=short


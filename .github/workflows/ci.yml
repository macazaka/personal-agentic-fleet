name: Fleet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  type-check:
    name: Pyright Type Analysis (Zero VSCode Diagnostics)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Type Check Test Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Run Pyright & VS Code Workspace Diagnostics
      shell: bash
      run: |
        set +e
        python -m fleet.tools.auto_fixer --no-pyright-cli --json
        npx --yes pyright fleet tests conftest.py pong.py > pyright_log.txt 2>&1
        PY_EXIT=$?
        cat pyright_log.txt
        if [ $PY_EXIT -ne 0 ]; then
          ERR_MSG=$(grep -E "error:|warning:" pyright_log.txt | head -n 5 | tr '\n' ' ')
          echo "::error title=Pyright Diagnostics::$ERR_MSG"
        fi
        exit $PY_EXIT

  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package & Test Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest anyio coverage requests starlette pydantic uvicorn

    - name: Run Test Suite
      timeout-minutes: 8
      shell: bash
      env:
        PYTHONPATH: .
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        FLEET_TEST_MODE: "1"
      run: |
        set +e
        python -m pytest tests/ -v --tb=short > pytest_log.txt 2>&1
        TEST_EXIT=$?
        cat pytest_log.txt
        if [ $TEST_EXIT -ne 0 ]; then
          FAIL_MSG=$(grep -E "FAILED |ERROR |E   " pytest_log.txt | head -n 10 | tr '\n' ' ')
          echo "::error title=Pytest Failure::$FAIL_MSG"
        fi
        exit $TEST_EXIT

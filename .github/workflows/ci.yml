name: Fleet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  type-check:
    name: Pyright Type Analysis (Zero VSCode Diagnostics)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run Pyright Type Checking
      shell: bash
      run: |
        set +e
        npx --yes pyright fleet tests conftest.py pong.py > pyright_log.txt 2>&1
        PY_EXIT=$?
        cat pyright_log.txt
        echo "### Pyright Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat pyright_log.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $PY_EXIT

  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package & Test Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest anyio coverage requests starlette pydantic uvicorn

    - name: Run Test Suite
      timeout-minutes: 8
      shell: bash
      env:
        PYTHONPATH: .
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        FLEET_TEST_MODE: "1"
      run: |
        set +e
        python -m pytest tests/ -v --tb=short > pytest_log.txt 2>&1
        TEST_EXIT=$?
        cat pytest_log.txt
        echo "### Pytest Output (${{ matrix.os }}, Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 60 pytest_log.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $TEST_EXIT


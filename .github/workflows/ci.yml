name: Fleet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package & Test Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest anyio coverage

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -c "import subprocess, os, sys; res = subprocess.run([sys.executable, '-m', 'pytest', 'tests/', '-v', '--tb=short'], capture_output=True, text=True); print(res.stdout); print(res.stderr, file=sys.stderr); open('pytest_log.txt', 'w', encoding='utf-8').write(res.stdout + '\n' + res.stderr); sys.exit(res.returncode)"

    - name: Upload Test Diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
        path: pytest_log.txt

<div id="viewOverview" style="display: none;">
      <!-- Morning Briefing Card -->
      <div class="briefing-box" id="briefingBox">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <span style="font-size: 12px; font-weight: 600; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px;" id="greetingText">Good Morning</span>
          <div class="briefing-headline" id="briefingHeadline">Loading today's briefing...</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn" style="font-size: 12px;" onclick="speakBriefing()" title="Listen to spoken audio briefing">🔊 Speak</button>
          <button title="Refresh today's morning briefing" class="btn" style="font-size: 12px;" onclick="fetchBriefing()">🔄 Refresh</button>
        </div>
      </div>
      <div class="briefing-stats" id="statsContainer">
        <!-- Rendered via JS -->
      </div>
      <div id="briefingMeetingsContainer" style="display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.25);">
      </div>
    </div>

    <!-- Main Grid -->
    <div class="dashboard-grid">
      <!-- Left Column: Tasks & Email Intelligence -->
      <div>
        <!-- Task Management Card -->
        <div class="card">
          <div class="card-title">
            <span>🎯 Daily Tasks & Goals</span>
            <span style="font-size: 12px; color: var(--text-muted);" id="taskCounter">0 Tasks</span>
          </div>

          <!-- Add Task Form -->
          <div class="task-input-bar">
            <input type="text" id="taskTitle" placeholder="Task title (e.g. 'Review quarterly budget')..." style="flex: 1.2;">
            <input type="text" id="taskDesc" placeholder="Description / details (required)..." style="flex: 1.8;" onkeypress="if(event.key==='Enter') addTask()">
            <select id="taskPriority" style="min-width: 110px;">
              <option value="P1">🔴 P1 High</option>
              <option value="P2" selected>🟡 P2 Medium</option>
              <option value="P3">🟢 P3 Low</option>
            </select>
            <select id="taskSource" style="min-width: 120px;">
              <option value="Dashboard" selected>💻 Dashboard</option>
              <option value="Manual">📍 Manual</option>
              <option value="Antigravity">⚡ Antigravity</option>
              <option value="Meeting">📅 Meeting</option>
              <option value="Email">📬 Email</option>
            </select>
            <button title="Add new task to the task board" class="btn btn-primary" onclick="addTask()">+ Add</button>
          </div>

          <!-- Task List -->
          <div class="task-list" id="taskList">
            <!-- Dynamic task items -->
          </div>
        </div>

        <!-- Email Intelligence Card -->
        <div class="card">
          <div class="card-title">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span>📬 Email Intelligence</span>
              <span style="font-size: 12px; color: var(--text-muted);">(This Month & Last Month)</span>
              <span style="font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600;" title="Tier 0 Deterministic: Email intelligence never uses tokens. Tokens are strictly reserved for code enhancement.">⚡ 0 Tokens ($0.00)</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span id="emailLiveStatus" style="font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(0, 242, 254, 0.1); color: var(--accent-cyan); border: 1px solid rgba(0, 242, 254, 0.3);">5 Folders</span>
              <button title="Sync and classify recent Gmail messages" class="btn btn-primary" style="font-size: 12px; padding: 6px 12px;" id="btnSyncEmails" onclick="syncEmails()">
                ⚡ Sync & Classify
              </button>
            </div>
          </div>

          <!-- Folder Category Pills -->
          <div class="email-pill-grid" id="emailPillGrid">
            <!-- Rendered via JS -->
          </div>

          <!-- Filter Tabs -->
          <div style="display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto;" id="emailFilterBar">
            <button title="All" class="filter-btn active" onclick="filterEmails('ALL')">All</button>
            <button title="📅 Meetings" class="filter-btn" onclick="filterEmails('Meetings')">📅 Meetings</button>
            <button title="💬 Respond" class="filter-btn" onclick="filterEmails('Respond')">💬 Respond</button>
            <button title="📝 Note" class="filter-btn" onclick="filterEmails('Note')">📝 Note</button>
            <button title="ℹ️ FYI" class="filter-btn" onclick="filterEmails('FYI')">ℹ️ FYI</button>
            <button title="🚫 Ignore" class="filter-btn" onclick="filterEmails('Ignore')">🚫 Ignore</button>
          </div>

          <!-- Email Feed -->
          <div id="emailList" style="max-height: 380px; overflow-y: auto;">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>

      <!-- Right Column: Routines, Performance & Activity -->
      <div>
        <!-- Daily Routine / Habits -->
        <div class="card">
          <div class="card-title">
            <span>🔄 Daily Routine & Habits</span>
          </div>
          <div id="routineList">
            <!-- Dynamic routines -->
          </div>
        </div>

        <!-- System & Activity Logs -->
        <div class="card">
          <div class="card-title">
            <span>📡 Fleet Activity Logs</span>
          </div>
          <div class="log-stream" id="logStream">
            <!-- Dynamic logs -->
          </div>
        </div>
      </div>
    </div>
    </div>

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agentic-fleet"
version = "2.11.1"
description = "An open-source, local-first agentic operating system with a plug-and-play microkernel architecture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "macazaka" }
]
keywords = ["agentic", "fleet", "dashboard", "local-first", "zero-token", "mcp", "antigravity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
full = [
    "keyring>=24.0.0",
    "PyYAML>=6.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
]
dev = [
    "pytest>=7.4.0",
    "coverage>=7.3.0",
    "pygame-ce>=2.5.0",
]

[project.scripts]
fleet = "fleet.cli:main"

[project.urls]
Homepage = "https://github.com/macazaka/personal-agentic-fleet"
Repository = "https://github.com/macazaka/personal-agentic-fleet.git"
Issues = "https://github.com/macazaka/personal-agentic-fleet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleet*"]

